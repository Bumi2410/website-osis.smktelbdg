<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | OSIS SMK Telkom Bandung</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-decor decor-one">✦</div>
    <div class="login-decor decor-two">★</div>

    <header class="login-top">
      <h1>Login Page</h1>
      <div class="school-brand" aria-label="OSIS SMK Telkom Bandung">
        <span class="brand-mark">✦</span>
        <span>SMK Telkom<br>Bandung</span>
      </div>
    </header>

    <form class="login-card" id="loginForm">
      <label class="login-field">
        <span>Usn :</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="login-field">
        <span>Pass :</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="primary-btn login-submit" id="loginSubmit" type="submit">Submit</button>
      <p class="form-message" id="loginMessage" role="status"></p>
    </form>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
